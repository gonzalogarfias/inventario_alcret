{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ALCRET - Inventario{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo-icon.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0B3C95">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS compilado (npm run build:css) -->
    <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
    
    <!-- Alpine.js 3.14.3 con SRI -->
    <script defer 
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" 
        integrity="sha384-PLACEHOLDER" 
        crossorigin="anonymous"></script>
    
    <style>[x-cloak] { display: none !important; }</style>
    {% block extra_head %}{% endblock %}
    
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('SW registrado:', reg.scope))
                .catch(err => console.error('SW error:', err));
        }
    </script>
</head>
<body class="bg-surface font-sans antialiased text-ink">
    {% block content %}{% endblock %}
</body>
</html>
